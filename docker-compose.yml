  # # Orchestrator service (for Saga orchestration)
  # anemoi_orchestrator:
  #   image: anemoi/orchestrator
  #   build:
  #     context: .
  #     dockerfile: Anemoi.Orchestrator/Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - PostgresDbSetting__ConnectionString=User ID=postgres;Password=JfhoCP4sbH2Jjg0nXTikYP1Y;Host=postgres;Port=5432;Pooling=true;Connection Lifetime=0;Database=Erp_Orchestrator
  #     - ConnectionStrings__MongoDb=mongodb://root:examplepassword@mongodb:27017
  #     - MassTransitSetting__Host=rabbitmq
