  # Workspace service
  anemoi_workspace:
    image: anemoi/workspace
    build:
      context: .
      dockerfile: Anemoi.Workspace/Anemoi.Workspace.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=User ID=postgres;Password=JfhoCP4sbH2Jjg0nXTikYP1Y;Host=postgres;Port=5432;Pooling=true;Connection Lifetime=0;Database=Erp_Workspace
