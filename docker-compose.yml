# version: '3.8'

# Load environment variables from .env file (copy from .env.example and fill real values)
# NEVER commit .env to version control!

services:
  # RabbitMQ service for event-driven messaging
  rabbitmq:
    image: masstransit/rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"      # RabbitMQ port
      - "15672:15672"    # RabbitMQ management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      

  # PostgreSQL service for relational data storage
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis stores JWT revocation markers shared by every gateway instance.
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microsoft SQL Server (Azure SQL Edge) for seed/data ingestion scenarios.
  # Azure SQL Edge is natively compiled for ARM64 (Apple Silicon), providing maximum stability.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: mssql
    hostname: mssql

    shm_size: "2gb"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - mssql_data:/var/opt/mssql

    security_opt:
      - seccomp:unconfined

    networks:
      - anemoi_network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # MongoDB service for NoSQL data storage
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - anemoi_network

  # Aggregation and Controllers service
  anemoi_centralize:
    user: root
    image: anemoi/centralize
    build:
      context: .
      dockerfile: Anemoi.Centralize/Anemoi.Centralize.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
      - RedisSetting__ConnectionString=redis:6379
      - JwtSetting__Issuer=${JWT_ISSUER}
      - JwtSetting__Audience=${JWT_AUDIENCE}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      anemoi_identity:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - anemoi_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./local_env/env_data:/app/env_data
      - ./local_env/sftp_data:/app/sftp_data
      - ./local_env/sftp_keys:/app/sftp_keys

  # Identity service
  anemoi_identity:
    image: anemoi/identity
    build:
      context: .
      dockerfile: Anemoi.Identity/Anemoi.Identity.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Identity
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtSetting__Issuer=${JWT_ISSUER}
      - JwtSetting__Audience=${JWT_AUDIENCE}
      - Kestrel__Endpoints__Http2__Url=http://0.0.0.0:5021
      - Kestrel__Endpoints__Http1__Url=http://0.0.0.0:5031
    volumes:
      - identity_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # Master Data service
  anemoi_masterdata:
    image: anemoi/masterdata
    build:
      context: .
      dockerfile: Anemoi.MasterData/Anemoi.MasterData.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=MasterData
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - masterdata_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # Notification service
  anemoi_notification:
    image: anemoi/notification
    build:
      context: .
      dockerfile: Anemoi.Notification/Anemoi.Notification.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Notification
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - notification_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # Orchestrator service (for Saga orchestration)
  # anemoi_orchestrator:
  #   image: anemoi/orchestrator
  #   build:
  #     context: ./Anemoi.Orchestrator
  #     dockerfile: Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Orchestrator
  #     - ConnectionStrings__MongoDb=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
  #     - MassTransitSetting__Host=rabbitmq
  #     - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
  #     - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   networks:
  #     - anemoi_network

  # Secure service
  # anemoi_secure:
  #   image: anemoi/secure
  #   build:
  #     context: ./Anemoi.Secure
  #     dockerfile: Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - MassTransitSetting__Host=rabbitmq
  #     - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
  #     - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - anemoi_network

  # Workspace service
  anemoi_workspace:
    image: anemoi/workspace
    build:
      context: .
      dockerfile: Anemoi.Workspace/Anemoi.Workspace.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Workspace
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - workspace_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  sftp:
    platform: linux/amd64
    image: atmoz/sftp:latest
    container_name: sftp_server
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./local_env/sftp_data:/home/user1/upload
      - ./local_env/sftp_keys:/home/user1/.ssh/keys:ro
    command: user1:123456:1001
    networks:
      - anemoi_network

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: smtp4dev_server
    restart: unless-stopped
    ports:
      - "25:25"
      - "5555:80"
    networks:
      - anemoi_network

networks:
  anemoi_network:
    driver: bridge

volumes:
  identity_keys:
  masterdata_keys:
  workspace_keys:
  notification_keys:
  mssql_data:
  postgres_data:
  mongodb_data:
  redis_data:
