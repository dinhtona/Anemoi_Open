# version: '3.8'

# Load environment variables from .env file (copy from .env.example and fill real values)
# NEVER commit .env to version control!

services:
  # RabbitMQ service for event-driven messaging
  rabbitmq:
    image: masstransit/rabbitmq
    container_name: rabbitmq
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5672:5672"      # RabbitMQ port
      - "${BIND_ADDRESS:-127.0.0.1}:15672:15672"    # RabbitMQ management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      

  # PostgreSQL service for relational data storage
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis stores JWT revocation markers shared by every gateway instance.
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - anemoi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microsoft SQL Server (Azure SQL Edge) for seed/data ingestion scenarios.
  # Azure SQL Edge is natively compiled for ARM64 (Apple Silicon), providing maximum stability.
  # mssql:
  #   image: mcr.microsoft.com/azure-sql-edge:latest
  #   container_name: mssql
  #   hostname: mssql

  #   shm_size: "2gb"

  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

  #   ports:
  #     - "${BIND_ADDRESS:-127.0.0.1}:1433:1433"

  #   volumes:
  #     - mssql_data:/var/opt/mssql

  #   security_opt:
  #     - seccomp:unconfined

  #   networks:
  #     - anemoi_network

  #   restart: unless-stopped

  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433'"
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 90s

  # MongoDB service for NoSQL data storage
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - anemoi_network

  # Aggregation and Controllers service
  anemoi_centralize:
    image: anemoi/centralize
    build:
      context: .
      dockerfile: Anemoi.Centralize/Anemoi.Centralize.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
      - RedisSetting__ConnectionString=redis:6379
      - JwtSetting__Issuer=${JWT_ISSUER}
      - JwtSetting__Audience=${JWT_AUDIENCE}
      - JwtSetting__PublicKeyPath=${JWT_PUBLIC_KEY_PATH:-/home/app/.anemoi/jwt/development-public.crt}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-}
      - DevEnvironmentsSetting__MailWebUiUrl=/mail/
      - DevEnvironmentsSetting__MailApiUrl=http://smtp4dev:80/mail/api/messages
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      anemoi_identity:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - anemoi_network
    volumes:
      - centralize_keys:/root/.aspnet/DataProtection-Keys
      - jwt_keys:/home/app/.anemoi/jwt
      # /var/run/docker.sock mount removed — Docker management API is Dev-only and not safe for production
      - ./local_env/env_data:/app/env_data
      - ./local_env/sftp_data:/app/sftp_data
      - ./local_env/sftp_keys:/app/sftp_keys

  # Identity service
  anemoi_identity:
    image: anemoi/identity
    build:
      context: .
      dockerfile: Anemoi.Identity/Anemoi.Identity.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Identity
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtSetting__Issuer=${JWT_ISSUER}
      - JwtSetting__Audience=${JWT_AUDIENCE}
      - JwtSetting__PrivateKeyPath=${JWT_PRIVATE_KEY_PATH:-/home/app/.anemoi/jwt/development-private.key}
      - JwtSetting__PublicKeyPath=${JWT_PUBLIC_KEY_PATH:-/home/app/.anemoi/jwt/development-public.crt}
      - ExternalAuthSetting__GoogleClientId=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - Kestrel__Endpoints__Http2__Url=http://0.0.0.0:5021
      - Kestrel__Endpoints__Http1__Url=http://0.0.0.0:5031
    volumes:
      - identity_keys:/home/app/.aspnet/DataProtection-Keys
      - jwt_keys:/home/app/.anemoi/jwt
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # Master Data service
  anemoi_masterdata:
    image: anemoi/masterdata
    build:
      context: .
      dockerfile: Anemoi.MasterData/Anemoi.MasterData.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=MasterData
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - masterdata_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # Notification service
  anemoi_notification:
    image: anemoi/notification
    build:
      context: .
      dockerfile: Anemoi.Notification/Anemoi.Notification.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Notification
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - notification_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  # HR service
  anemoi_hr:
    image: anemoi/hr
    build:
      context: .
      dockerfile: Anemoi.Hr/Anemoi.Hr.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Hr
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtSetting__Issuer=${JWT_ISSUER}
      - JwtSetting__Audience=${JWT_AUDIENCE}
      - JwtSetting__PublicKeyPath=${JWT_PUBLIC_KEY_PATH:-/home/app/.anemoi/jwt/development-public.crt}
      - HrSettings__BusinessTimeZone=Asia/Ho_Chi_Minh
      - HrSettings__MonthlyAccrualCheckIntervalHours=12
      - HrSettings__MonthlyAccrualRunHour=0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HR_API_HOST_PORT:-8082}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      anemoi_identity:
        condition: service_started
    networks:
      - anemoi_network
    volumes:
      - jwt_keys:/home/app/.anemoi/jwt

  # Orchestrator service (for Saga orchestration)
  # anemoi_orchestrator:
  #   image: anemoi/orchestrator
  #   build:
  #     context: ./Anemoi.Orchestrator
  #     dockerfile: Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Orchestrator
  #     - ConnectionStrings__MongoDb=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
  #     - MassTransitSetting__Host=rabbitmq
  #     - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
  #     - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   networks:
  #     - anemoi_network

  # Secure service
  # anemoi_secure:
  #   image: anemoi/secure
  #   build:
  #     context: ./Anemoi.Secure
  #     dockerfile: Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - MassTransitSetting__Host=rabbitmq
  #     - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
  #     - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - anemoi_network

  # Workspace service
  anemoi_workspace:
    image: anemoi/workspace
    build:
      context: .
      dockerfile: Anemoi.Workspace/Anemoi.Workspace.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=Workspace
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=${RABBITMQ_DEFAULT_USER}
      - MassTransitSetting__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - workspace_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anemoi_network

  sftp:
    platform: linux/amd64
    image: atmoz/sftp:latest
    container_name: sftp_server
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SFTP_HOST_PORT:-2222}:22"
    volumes:
      - ./local_env/sftp_data:/home/user1/upload
      - ./local_env/sftp_keys:/home/user1/.ssh/keys:ro
      - sftp_host_keys:/etc/ssh
    entrypoint:
      - /bin/sh
      - -c
      - ssh-keygen -A && exec /entrypoint "$$@"
      - --
    command:
      - user1:123456:1001
    networks:
      - anemoi_network

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: smtp4dev_server
    restart: unless-stopped
    command: --basepath=/mail
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SMTP_HOST_PORT:-25}:25"
      - "${BIND_ADDRESS:-127.0.0.1}:${SMTP_WEB_HOST_PORT:-5555}:80"
    networks:
      - anemoi_network

  # Next.js frontend. Browser traffic should enter through Caddy so the
  # frontend and API share one HTTPS origin.
  # anemoi_web:
  #   image: anemoi/web
  #   build:
  #     context: ./cody-web-app
  #     dockerfile: Dockerfile
  #   environment:
  #     - NEXT_PUBLIC_API_BASE_URL=http://anemoi_centralize:8080
  #   depends_on:
  #     - anemoi_centralize
  #   networks:
  #     - anemoi_network

  # Single HTTP(S) entrypoint for the frontend and API. Caddy creates a local
  # development CA certificate for https://localhost automatically.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:3000:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # - anemoi_web
      - anemoi_centralize
    networks:
      - anemoi_network

  # Optional stable public entrypoint. Create one Cloudflare Tunnel whose
  # published application targets http://caddy:80, then start profile "public".
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles:
      - public
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks:
      - anemoi_network

networks:
  anemoi_network:
    driver: bridge

volumes:
  centralize_keys:
  identity_keys:
  masterdata_keys:
  workspace_keys:
  notification_keys:
  jwt_keys:
  # mssql_data:
  postgres_data:
  mongodb_data:
  redis_data:
  sftp_host_keys:
  caddy_data:
  caddy_config:
