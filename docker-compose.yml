version: '3.8'

services:
  # RabbitMQ service for event-driven messaging
  rabbitmq:
    image: masstransit/rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"      # RabbitMQ port
      - "15672:15672"    # RabbitMQ management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - anemoi_network
      

  # PostgreSQL service for relational data storage
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JfhoCP4sbH2Jjg0nXTikYP1Y
    ports:
      - "5432:5432"
    networks:
      - anemoi_network

  # MongoDB service for NoSQL data storage
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: JfhoCP4sbH2Jjg0nXTikYP1Y
    networks:
      - anemoi_network

  # Aggregation and Controllers service
  anemoi_centralize:
    image: anemoi/centralize
    build:
      context: .
      dockerfile: Anemoi.Centralize/Anemoi.Centralize.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=guest
      - MassTransitSetting__Password=guest
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
    networks:
      - anemoi_network
    restart: always

  # Identity service
  anemoi_identity:
    image: anemoi/identity
    build:
      context: .
      dockerfile: Anemoi.Identity/Anemoi.Identity.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=User ID=postgres;Password=JfhoCP4sbH2Jjg0nXTikYP1Y;Host=postgres;Port=5432;Pooling=true;Connection Lifetime=0;Database=Erp_Identity
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=guest
      - MassTransitSetting__Password=guest
    ports:
      # - "8080:8080"
      - "8081:8081" # Identity service port
      # - "5031:5031"
      # - "5021:5021" # Identity service port
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - anemoi_network
    restart: always      

  # Master Data service
  anemoi_masterdata:
    image: anemoi/masterdata
    build:
      context: .
      dockerfile: Anemoi.MasterData/Anemoi.MasterData.WorkerService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PostgresDbSetting__ConnectionString=User ID=postgres;Password=JfhoCP4sbH2Jjg0nXTikYP1Y;Host=postgres;Port=5432;Pooling=true;Connection Lifetime=0;Database=Erp_MasterData
      - MassTransitSetting__Host=rabbitmq
      - MassTransitSetting__UserName=guest
      - MassTransitSetting__Password=guest
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - anemoi_network
    restart: always      

  # # Notification service (for sending emails)
